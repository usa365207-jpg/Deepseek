<!DOCTYPE html>
<html lang="hi">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>DeepSeek Private Chat</title>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; }
    body { background-color: #0f172a; color: #f8fafc; display: flex; flex-direction: column; height: 100vh; }
    
    /* Top Bar */
    header { padding: 12px 15px; background-color: #1e293b; border-bottom: 1px solid #334155; display: flex; justify-content: space-between; align-items: center; }
    header h1 { font-size: 1rem; color: #38bdf8; }
    .settings-btn { background: #334155; color: #fff; border: none; padding: 6px 12px; border-radius: 6px; font-size: 0.8rem; cursor: pointer; }

    /* Settings Panel */
    #settings-modal { display: none; position: fixed; top: 0; left: 0; width: 100%; height: 100%; background: rgba(0,0,0,0.8); z-index: 100; justify-content: center; align-items: center; padding: 20px; }
    .modal-content { background: #1e293b; width: 100%; max-width: 400px; padding: 20px; border-radius: 12px; border: 1px solid #475569; display: flex; flex-direction: column; gap: 12px; }
    .modal-content h2 { font-size: 1.1rem; color: #38bdf8; }
    .modal-content label { font-size: 0.85rem; color: #94a3b8; }
    .modal-content input, .modal-content select, .modal-content textarea { width: 100%; padding: 10px; border-radius: 6px; border: 1px solid #475569; background: #0f172a; color: #fff; outline: none; }
    .save-btn { background: #38bdf8; color: #0f172a; font-weight: bold; border: none; padding: 10px; border-radius: 6px; cursor: pointer; }

    /* Chat Area */
    #chat-container { flex: 1; padding: 15px; overflow-y: auto; display: flex; flex-direction: column; gap: 12px; }
    .message { max-width: 85%; padding: 10px 14px; border-radius: 12px; line-height: 1.4; font-size: 0.95rem; word-wrap: break-word; white-space: pre-wrap; }
    .user { align-self: flex-end; background-color: #0284c7; color: #fff; border-bottom-right-radius: 2px; }
    .bot { align-self: flex-start; background-color: #334155; color: #f8fafc; border-bottom-left-radius: 2px; }

    /* Input Area */
    #input-area { padding: 12px; background-color: #1e293b; border-top: 1px solid #334155; display: flex; gap: 8px; }
    #user-input { flex: 1; padding: 12px; border-radius: 8px; border: 1px solid #475569; background-color: #0f172a; color: #fff; outline: none; font-size: 0.95rem; }
    #send-btn { padding: 12px 18px; border-radius: 8px; border: none; background-color: #38bdf8; color: #0f172a; font-weight: bold; cursor: pointer; }
  </style>
</head>
<body>

  <header>
    <h1>DeepSeek Unfiltered Chat</h1>
    <button class="settings-btn" onclick="openSettings()">⚙️ Settings</button>
  </header>

  <div id="chat-container"></div>

  <div id="input-area">
    <input type="text" id="user-input" placeholder="Type message..." onkeydown="if(event.key==='Enter') sendMessage()">
    <button id="send-btn" onclick="sendMessage()">Send</button>
  </div>

  <!-- Modal -->
  <div id="settings-modal">
    <div class="modal-content">
      <h2>App Settings</h2>
      <div>
        <label>OpenRouter API Key:</label>
        <input type="password" id="api-key-input" placeholder="sk-or-v1-...">
      </div>
      <div>
        <label>Model:</label>
        <select id="model-select">
          <option value="deepseek/deepseek-chat">DeepSeek Chat (V3)</option>
          <option value="deepseek/deepseek-r1">DeepSeek R1 (Reasoning)</option>
        </select>
      </div>
      <div>
        <label>System Instructions (Persona):</label>
        <textarea id="system-prompt-input" rows="3">You are a fun, highly interactive AI partner. Speak fluently in Hinglish. You have open guardrails for natural casual roleplay conversations.</textarea>
      </div>
      <button class="save-btn" onclick="saveSettings()">Save & Close</button>
    </div>
  </div>

  <script>
    let API_KEY = localStorage.getItem("ds_api_key") || "";
    let MODEL = localStorage.getItem("ds_model") || "deepseek/deepseek-chat";
    let SYSTEM_PROMPT = localStorage.getItem("ds_system") || "You are a fun, highly interactive AI partner. Speak fluently in Hinglish. You have open guardrails for natural casual roleplay conversations.";

    let history = [{ role: "system", content: SYSTEM_PROMPT }];

    window.onload = () => {
      if (!API_KEY) openSettings();
      else appendMessage("System", "Bot ready! Click ⚙️ Settings anytime to change Key/Instructions.", "bot");
    };

    function openSettings() {
      document.getElementById("api-key-input").value = API_KEY;
      document.getElementById("model-select").value = MODEL;
      document.getElementById("system-prompt-input").value = SYSTEM_PROMPT;
      document.getElementById("settings-modal").style.display = "flex";
    }

    function saveSettings() {
      API_KEY = document.getElementById("api-key-input").value.trim();
      MODEL = document.getElementById("model-select").value;
      SYSTEM_PROMPT = document.getElementById("system-prompt-input").value.trim();

      localStorage.setItem("ds_api_key", API_KEY);
      localStorage.setItem("ds_model", MODEL);
      localStorage.setItem("ds_system", SYSTEM_PROMPT);

      history = [{ role: "system", content: SYSTEM_PROMPT }];
      document.getElementById("settings-modal").style.display = "none";
      alert("Settings Saved!");
    }

    async function sendMessage() {
      const inputEl = document.getElementById("user-input");
      const text = inputEl.value.trim();
      if (!text) return;

      if (!API_KEY) {
        alert("Please add your OpenRouter API key in Settings first!");
        openSettings();
        return;
      }

      appendMessage("You", text, "user");
      inputEl.value = "";
      history.push({ role: "user", content: text });

      const botMsgEl = appendMessage("DeepSeek", "Thinking...", "bot");

      try {
        const res = await fetch("https://openrouter.ai/api/v1/chat/completions", {
          method: "POST",
          headers: {
            "Authorization": `Bearer ${API_KEY}`,
            "Content-Type": "application/json"
          },
          body: JSON.stringify({
            model: MODEL,
            messages: history
          })
        });

        const data = await res.json();
        if(data.error) {
          botMsgEl.innerText = "Error: " + data.error.message;
          return;
        }

        const reply = data.choices[0].message.content;
        botMsgEl.innerText = reply;
        history.push({ role: "assistant", content: reply });

      } catch (err) {
        botMsgEl.innerText = "Connection Error! Check your network or API Key.";
      }
    }

    function appendMessage(sender, text, type) {
      const container = document.getElementById("chat-container");
      const div = document.createElement("div");
      div.classList.add("message", type);
      div.innerText = text;
      container.appendChild(div);
      container.scrollTop = container.scrollHeight;
      return div;
    }
  </script>
</body>
</html>
